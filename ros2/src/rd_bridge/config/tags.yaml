# apriltag_ros 설정 — bridge.launch.py tag:=true 가 쓴다
# size = 인쇄한 태그의 **검은 테두리 바깥 한 변(m)**. 흰 여백은 빼고 자로 재서 고칠 것
/**:
  ros__parameters:
    image_transport: raw
    family: 36h11
    # 자로 잰 값을 넣는 곳은 **여기 한 곳뿐이다.**
    # 지금 쓰는 인쇄물 실측 (9/16): 작은 한 칸 24mm · 검은 사각형 한 변 192mm.
    # 36h11 은 검은 사각형이 8칸이라 24 x 8 = 192 로 두 실측이 맞는다.
    # 태그를 새로 뽑으면 한 칸을 재서 x8 하거나 검은 사각형을 직접 재서 고친다.
    # ⚠ tag.sizes(id별)를 쓰면 그쪽이 이겨서 이 값이 조용히 무시된다 — 아래 주석 참고
    size: 0.192
    max_hamming: 0
    detector:
      threads: 2
      # 2.0 은 검출용 해상도를 반으로 깎는다. 짐벌 -90° 탑뷰에서 120mm 태그는
      # 5m 에 30px 뿐이라 반으로 깎으면 못 잡는다 — 1.0 으로 둔다
      decimate: 1.0
      blur: 0.0
      # bool 이다. 1 을 넣으면 InvalidParameterTypeException 으로 노드가 abort(-6) 한다
      refine: true
      sharpening: 0.25
    pose_estimation_method: "pnp"
    # 프레임 이름을 못 박는다 — 기본 이름(36h11:0 / tag36h11:0)이 판마다 달라서
    # tf2_echo·tag_follow_node 가 헛다리를 짚는다
    # ⚠ sizes(id별 크기)는 일부러 안 쓴다 — 있으면 위의 size 를 이겨서, size 만 고치고
    #   sizes 를 안 고치면 거리가 그 비율만큼 틀린 채로 조용히 돈다 (9/16 에 실제로 겪었다)
    tag:
      ids: [0]
      frames: [tag0]
